
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Beauty and Cosmetics Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightpink;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #8b004b;
        }

        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            color: #8b004b;
        }

        .card p {
            color: #555;
        }

        button {
            background-color: #e75480;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c2185b;
        }
    </style>
</head>

<body>
    <h1>Our Products</h1>

    <div class="products">

        <div class="card">
            <img src="https://placehold.co/300x200/fce4ec/8b004b?text=Skin+Care"
                 alt="Skin care products">
            <h3>Skin Care</h3>
            <p>Discover our latest skin care products.</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200/f8bbd0/8b004b?text=Hair+Care"
                 alt="Hair care products">
            <h3>Hair Care</h3>
            <p>Explore our latest hair care products.</p>
            <button type="button">Buy Now</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x200/f3d5e5/8b004b?text=Beauty+Products"
                 alt="Beauty and cosmetics products">
            <h3>Beauty Products</h3>
            <p>Find your favorite beauty and cosmetic products.</p>
            <button type="button">Buy Now</button>
        </div>

    </div>
</body>
</html>
